<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06101b">
  <title>إدارة الحساب | Gloss Boss</title>
  <link rel="stylesheet" href="portal.css">
  <style>
    .actionPage {
      width: min(520px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .actionBrand {
      display: grid;
      justify-items: center;
      gap: 12px;
      margin-bottom: 22px;
      text-align: center;
    }

    .actionLogo {
      width: 104px;
      height: 104px;
      object-fit: cover;
      border: 1px solid rgba(104, 217, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    .actionBrand strong {
      font: 800 21px/1.3 var(--font-display);
    }

    .actionBrand span {
      color: var(--muted);
      font-size: 13px;
    }

    .actionCard {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
    }

    .actionCard h1 {
      margin: 10px 0 8px;
      font: 800 clamp(25px, 6vw, 34px)/1.25 var(--font-display);
    }

    .actionLead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.8;
    }

    .accountEmail {
      display: block;
      margin-top: 7px;
      color: var(--cool-strong);
      direction: ltr;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .passwordWrap {
      position: relative;
    }

    .passwordWrap .fieldInput {
      padding-left: 52px;
    }

    .passwordToggle {
      position: absolute;
      left: 8px;
      bottom: 8px;
      min-width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      color: var(--cool-strong);
      background: rgba(104, 217, 255, 0.08);
      cursor: pointer;
    }

    .actionLinks {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .actionLinks .navButton {
      width: 100%;
    }

    .actionSpinner {
      width: 34px;
      height: 34px;
      margin: 8px auto 18px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--cool);
      border-radius: 50%;
      animation: actionSpin 0.8s linear infinite;
    }

    @keyframes actionSpin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 520px) {
      .actionPage {
        padding-top: 18px;
      }

      .actionCard {
        padding: 23px 18px;
      }
    }
  </style>
</head>
<body class="portalPage">
  <main class="actionPage">
    <header class="actionBrand">
      <img class="actionLogo" src="glos.jpeg" alt="Gloss Boss Detailing">
      <div>
        <strong>Gloss Boss Detailing</strong>
        <span>حسابك بأمان، وبشكل مرتب</span>
      </div>
    </header>

    <section class="actionCard">
      <div id="loadingState">
        <div class="actionSpinner" aria-hidden="true"></div>
        <p class="actionLead" style="text-align:center">جاري فحص الرابط...</p>
      </div>

      <div id="resetState" class="hidden">
        <span class="hintBadge">استعادة الحساب</span>
        <h1>اختر كلمة سر جديدة</h1>
        <p class="actionLead">
          اكتب كلمة سر جديدة من 6 أحرف أو أكثر للحساب:
          <span id="accountEmail" class="accountEmail"></span>
        </p>

        <form id="resetForm" class="formGrid">
          <div class="fieldGroup passwordWrap">
            <label class="fieldLabel" for="newPassword">كلمة السر الجديدة</label>
            <input id="newPassword" class="fieldInput" type="password" minlength="6" required autocomplete="new-password" placeholder="6 أحرف أو أكثر">
            <button class="passwordToggle" type="button" data-target="newPassword" aria-label="إظهار كلمة السر">◉</button>
          </div>

          <div class="fieldGroup passwordWrap">
            <label class="fieldLabel" for="confirmPassword">تأكيد كلمة السر</label>
            <input id="confirmPassword" class="fieldInput" type="password" minlength="6" required autocomplete="new-password" placeholder="أعد كتابة كلمة السر">
            <button class="passwordToggle" type="button" data-target="confirmPassword" aria-label="إظهار كلمة السر">◉</button>
          </div>

          <button id="savePasswordBtn" class="primaryAction" type="submit">حفظ كلمة السر</button>
        </form>
      </div>

      <div id="resultState" class="hidden">
        <span id="resultBadge" class="hintBadge">Gloss Boss</span>
        <h1 id="resultTitle"></h1>
        <p id="resultMessage" class="actionLead"></p>
        <div class="actionLinks">
          <a id="loginLink" class="navButton primary" href="login.html">العودة لتسجيل الدخول</a>
          <a id="retryLink" class="navButton ghostAction hidden" href="login.html">طلب رابط جديد</a>
        </div>
      </div>

      <div id="messageBox" class="messageBox hidden" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    import {
      applyActionCode,
      checkActionCode,
      confirmPasswordReset,
      verifyPasswordResetCode,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { auth, authReady } from "./firebase-config.js";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "";
    const actionCode = params.get("oobCode") || "";
    const continueUrl = getSafeContinueUrl(params.get("continueUrl"));

    const loadingState = document.getElementById("loadingState");
    const resetState = document.getElementById("resetState");
    const resultState = document.getElementById("resultState");
    const resetForm = document.getElementById("resetForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const savePasswordBtn = document.getElementById("savePasswordBtn");
    const accountEmail = document.getElementById("accountEmail");
    const messageBox = document.getElementById("messageBox");
    const loginLink = document.getElementById("loginLink");
    const retryLink = document.getElementById("retryLink");

    let verifiedEmail = "";

    await authReady.catch(() => {});
    bindEvents();
    await handleAction();

    function bindEvents() {
      resetForm.addEventListener("submit", saveNewPassword);

      document.querySelectorAll(".passwordToggle").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          button.setAttribute("aria-label", show ? "إخفاء كلمة السر" : "إظهار كلمة السر");
        });
      });
    }

    async function handleAction() {
      if (!actionCode) {
        showError("الرابط غير مكتمل", "هذا الرابط لا يحتوي رمز التحقق المطلوب. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.");
        return;
      }

      try {
        if (mode === "resetPassword") {
          verifiedEmail = await verifyPasswordResetCode(auth, actionCode);
          accountEmail.textContent = verifiedEmail;
          showState(resetState);
          newPassword.focus();
          return;
        }

        if (mode === "verifyEmail") {
          await applyActionCode(auth, actionCode);
          showResult("تم تفعيل البريد", "تم تفعيل حسابك بنجاح. يمكنك الآن تسجيل الدخول إلى Gloss Boss.", "تم بنجاح");
          return;
        }

        if (mode === "recoverEmail") {
          const info = await checkActionCode(auth, actionCode);
          await applyActionCode(auth, actionCode);
          const restoredEmail = info?.data?.email || "";
          showResult(
            "تم استرجاع البريد",
            restoredEmail ? `تمت استعادة البريد ${restoredEmail} بنجاح.` : "تمت استعادة بريد حسابك بنجاح.",
            "تم بنجاح",
          );
          return;
        }

        showError("الرابط غير معروف", "نوع رابط الحساب غير مدعوم. ارجع إلى صفحة تسجيل الدخول وحاول مرة أخرى.");
      } catch (error) {
        console.error("Firebase email action failed:", error);
        showError("انتهت صلاحية الرابط", "الرابط غير صالح أو تم استخدامه من قبل. اطلب رابطًا جديدًا ثم افتح أحدث رسالة وصلتك.");
      }
    }

    async function saveNewPassword(event) {
      event.preventDefault();
      clearMessage();

      if (newPassword.value.length < 6) {
        setMessage("كلمة السر يجب أن تكون 6 أحرف أو أكثر.", "error");
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        setMessage("كلمتا السر غير متطابقتين.", "error");
        return;
      }

      savePasswordBtn.disabled = true;
      savePasswordBtn.textContent = "جاري الحفظ...";

      try {
        await confirmPasswordReset(auth, actionCode, newPassword.value);
        showResult(
          "تم تغيير كلمة السر",
          `تم حفظ كلمة السر الجديدة${verifiedEmail ? ` للحساب ${verifiedEmail}` : ""}. يمكنك تسجيل الدخول الآن.`,
          "تم بنجاح",
        );
      } catch (error) {
        console.error("Password reset confirmation failed:", error);
        setMessage(
          error?.code === "auth/weak-password"
            ? "كلمة السر ضعيفة. استخدم 6 أحرف أو أكثر."
            : "تعذر حفظ كلمة السر. قد يكون الرابط انتهت صلاحيته؛ اطلب رابطًا جديدًا.",
          "error",
        );
      } finally {
        savePasswordBtn.disabled = false;
        savePasswordBtn.textContent = "حفظ كلمة السر";
      }
    }

    function showResult(title, message, badge) {
      document.getElementById("resultTitle").textContent = title;
      document.getElementById("resultMessage").textContent = message;
      document.getElementById("resultBadge").textContent = badge;
      loginLink.href = continueUrl || "login.html?message=password_reset_done";
      showState(resultState);
    }

    function showError(title, message) {
      showResult(title, message, "الرابط غير صالح");
      loginLink.classList.add("hidden");
      retryLink.classList.remove("hidden");
    }

    function showState(target) {
      loadingState.classList.add("hidden");
      resetState.classList.add("hidden");
      resultState.classList.add("hidden");
      target.classList.remove("hidden");
      clearMessage();
    }

    function setMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `messageBox is-${type}`;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "messageBox hidden";
    }

    function getSafeContinueUrl(value) {
      if (!value) {
        return "";
      }

      try {
        const url = new URL(value);
        const allowedHosts = new Set([
          window.location.host,
          "braazbedat10205-blip.github.io",
          "gloos-boos-site.firebaseapp.com",
          "gloos-boos-site.web.app",
        ]);
        return allowedHosts.has(url.host) ? url.toString() : "";
      } catch {
        return "";
      }
    }
  </script>
</body>
</html>
